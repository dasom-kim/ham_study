name: ham_study
description: Cute character study timer for iOS and Android.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  # flutter_local_notifications: ^21.0.0  # CocoaPods 호환성 문제로 임시 제거
  # live_activities: ^2.4.9  # iOS CocoaPods 호환성 문제로 임시 제거
  # home_widget: ^0.9.1  # 나중에 사용할 수 있으니 임시 주석 처리
  # permission_handler: ^12.0.1  # iOS CocoaPods 호환성 문제 해결
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  google_sign_in: ^6.2.1
  # sign_in_with_apple: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/characters/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#F6F5F0"
  adaptive_icon_foreground: "assets/images/app_icon.png"
